# references/overrides.toml
#
# Hand corrections to the merged bibliography. This is the only place a
# reference is ever fixed by hand. Never edit a bibliography under
# imported_papers/, and never edit references/merged.bib, which is generated.
#
# After every change:
#     uv run --no-project python scripts/merge_bib.py
#
# references/merge_report.md lists everything the script could not decide on
# its own and prints a ready to paste block for each case.
#
# ---------------------------------------------------------------------------
# 1. Correcting one entry
# ---------------------------------------------------------------------------
#
# Address an entry by any key it has ever had: an original key from a source
# bibliography, or the generated key. Whatever you set wins over whatever the
# merge decided, and settles any conflict on that field.
#
#     [entry.zhao_survey_2023]
#     doi = "10.48550/arXiv.2303.18223"
#     journal = "Journal of Artificial Intelligence Research"
#
# Three directives are available alongside ordinary fields. They start with an
# underscore, which no BibTeX field does.
#
#     _key    = "sager_survey_2026"   # pin the citation key
#     _type   = "article"             # override the entry type
#     _remove = ["note", "url"]       # delete fields
#     _drop   = true                  # leave the entry out of the bibliography
#
# ---------------------------------------------------------------------------
# 2. Two entries that are the same work
# ---------------------------------------------------------------------------
#
# The script merges entries that share a DOI, an arXiv identifier, or a title
# and first author. Anything looser is reported and left alone. Confirm a match
# like this:
#
#     [[merge]]
#     keys = ["radford2019language", "radford_gpt2_2019"]
#     reason = "same technical report, one cited as a preprint"
#
# ---------------------------------------------------------------------------
# 3. Two entries that only look like the same work
# ---------------------------------------------------------------------------
#
# A split is permanent. The script will never merge these, whatever signal says
# they match, which also covers the case of a shared DOI typo.
#
#     [[split]]
#     keys = ["he2016deep", "he2016identity"]
#     reason = "ResNet and the pre-activation follow up, different papers"
#
# ---------------------------------------------------------------------------
# 4. Venue names, applied everywhere
# ---------------------------------------------------------------------------
#
# One table per field. The left side is matched loosely, ignoring case,
# punctuation and accents, so "Proc. of NIPS'16" and "proc of nips 16" are the
# same probe. The right side is written out verbatim.
#
#     [replace.booktitle]
#     "Proc. of NIPS'16" = "Advances in Neural Information Processing Systems"
#
#     [replace.journal]
#     "TPAMI" = "IEEE Transactions on Pattern Analysis and Machine Intelligence"

# ===========================================================================
# Corrections
# ===========================================================================

# The GPT-3 entry in the ACU bibliography carries BERT's DOI, so the two
# merged into one reference. The DOI below is GPT-3's own.
[entry.brown_language_2020]
doi = "10.48550/arXiv.2005.14165"

# COGITAO's year changed from 2025 to 2026 when the workshop acceptance came
# through, and assign_keys carries a group's previous key on purpose so that
# citations written against it keep working. That left the generated key
# naming the wrong year, so it is pinned here instead.
[entry.cogitao]
_key = "taoudibenchekroun_cogitao_2026"

[[split]]
keys = ["brown_language_2020", "devlinBERTPretrainingDeep2019"]
reason = "GPT-3 and BERT, merged only because the GPT-3 entry had BERT's DOI"

# arXiv 2306.02552 was retitled between versions, so the ACU bibliography
# holds it twice under two different titles. Same work.
[[merge]]
keys = ["wang_user_2024", "wang_when_2023"]
reason = "same arXiv paper, title changed between v1 and the published version"


# ===========================================================================
# Venue names
# ===========================================================================

[replace.journal]

[replace.booktitle]

[replace.publisher]


# ===========================================================================
# The CNA paper's inline bibliography, resolved
# ===========================================================================
#
# The Neural Computation manuscript pastes its references into the document as
# \bibitem entries, so scripts/split_paper.py converts them and the author
# field comes out as a formatted string: "LeCun et~al." rather than a list of
# names. The merge therefore cannot see that these are the same works it
# already has from a real .bib, and it generated a second entry for each.
# merge_report.md reported every one of them as a citation key that would
# resolve to the wrong reference, and all six are cited from the CNA chapter,
# which the thesis reproduces.
#
# Each pair below was checked by title and author before being confirmed. The
# entry with the real author list wins, so the chapter now cites a complete
# reference.
#
# A directive names the keys the source bibliographies use, not the keys this
# script generates: the generated ones do not exist yet when the directive is
# applied. Five of these are one key that two bibliographies use for the same
# work, so naming it once is the whole instruction.

[[merge]]
keys = ["lecun_backpropagation_1989"]
reason = "the ACU bibliography and CNA's \\bibitem list, same paper"

[[merge]]
keys = ["lecun_deep_2015"]
reason = "the ACU bibliography and CNA's \\bibitem list, same Nature review"

[[merge]]
keys = ["sager_unsupervised_2022"]
reason = "the Hounsfield bibliography and CNA's \\bibitem list, same paper"

[[merge]]
keys = ["simmler_survey_2021"]
reason = "three bibliographies and CNA's \\bibitem list, same survey"

[[merge]]
keys = ["tuggener_real_2024"]
reason = "the Hounsfield bibliography and CNA's \\bibitem list, same paper"

[[merge]]
keys = ["meyer2025hounsfield", "meyer_hounsfield_2025"]
reason = "CNA's \\bibitem list and references/manual.bib, same paper"

# Not from the CNA list. The world models paper is cited as ha2018world by two
# bibliographies, one holding the arXiv preprint titled "World Models" and the
# other the NeurIPS version titled "Recurrent World Models Facilitate Policy
# Evolution". Both citing chapters are summarised, so neither reaches the
# build today, and the ambiguity would return the day either is wired back in.
[[merge]]
keys = ["ha2018world"]
reason = "preprint and conference version of one paper"
