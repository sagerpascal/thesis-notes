# Ledger of thesis wide terms. One entry per term, with its single definition
# site in the thesis frame and the name each imported chapter uses for the
# same idea. See CLAUDE.md 3.5 and 3.9. Add a term the day it is coined.

[layout]
definition = "the way a computation is distributed over a network's parts, whether those parts are neurons or the rows and columns of a weight matrix"
site = "sections/1-1_introduction.tex, section A task fixes what a network computes"
synonyms = { grokking = "circuit", attention = "structure, as in symmetric or directional structure and column dominance" }

[credit_assignment_algorithm]
definition = "the computation that assigns each weight its share of the error at the output; backpropagation is one"
site = "sections/1-1_introduction.tex, section A task fixes what a network computes"
synonyms = { grokking = "credit assignment algorithm" }

[optimizer]
definition = "the procedure that turns each weight's share of the error into a change of the weights, such as SGD or Adam"
site = "sections/1-1_introduction.tex, section A task fixes what a network computes"
synonyms = { grokking = "optimizer" }

[learning_rule]
definition = "a credit assignment algorithm paired with an optimizer"
site = "sections/1-1_introduction.tex, section A task fixes what a network computes"
synonyms = { grokking = "learning rule, rule" }

[grokking]
definition = "a network fits its training data perfectly, sits at chance on held out data for thousands of epochs, then generalises abruptly"
site = "sections/1-1_introduction.tex, glossed inline at first use, not coined by the thesis"
synonyms = { grokking = "grokking, groks" }

[effective_unit_count]
definition = "n times the participation ratio of a layer's outgoing weight norms, for a layer of n units"
site = "chapter grokking, imported. The frame uses it as plain text and sends the reader there"
synonyms = { grokking = "effective unit count, n PR" }

[net]
definition = "a set of neurons each of which is supported by several others through recurrent connections, the representation of one sensory pattern in the Cooperative Network Architecture"
site = "chapter cna, imported. The frame describes it in plain words and sends the reader there"
synonyms = { cna = "net, assembled from net fragments" }
