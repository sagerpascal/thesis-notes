# Ledger of thesis wide terms. One entry per term, with its single definition
# site in the thesis frame and the name each imported chapter uses for the
# same idea. See CLAUDE.md 3.5 and 3.9. Add a term the day it is coined.

# DECIDED 2026-11-14, PARTLY APPLIED. The author chose "circuit" as the thesis
# wide noun, replacing "layout". The part titles and the subtitle were swept on
# 2026-11-14. The prose is not swept, because most of it is in
# sections/1-1_introduction.tex, which argues the retired story throughout and
# is rewritten rather than edited. 56 occurrences of "layout" remain in thesis
# owned files, 41 of them in that file. The sweep happens with the rewrite.
[circuit]
definition = "the set of neurons that carry a computation, counted as the participation ratio of a layer's outgoing weight norms. Narrower than the mechanistic interpretability sense, where a circuit is a subgraph of components, and the introduction says so at the definition site"
site = "sections/1-1_introduction.tex, section A trained network uses some of its neurons and not others, and the task does not set which"
synonyms = { grokking = "circuit, circuit size, circuit concentration", attention = "structure, as in symmetric or directional structure and column dominance" }
# The word the thesis frame used until 2026-11-14. It is not a synonym any
# chapter uses, it is the retired frame term, kept here so a sweep can be
# checked against it.
retired_frame_term = "layout"

[credit_assignment_algorithm]
definition = "the computation that assigns each weight its share of the error at the output; backpropagation is one"
site = "sections/1-1_introduction.tex, section A trained network uses some of its neurons and not others, and the task does not set which"
synonyms = { grokking = "credit assignment algorithm" }

[optimizer]
definition = "the procedure that turns each weight's share of the error into a change of the weights, such as SGD or Adam"
site = "sections/1-1_introduction.tex, section A trained network uses some of its neurons and not others, and the task does not set which"
synonyms = { grokking = "optimizer" }

[learning_rule]
definition = "a credit assignment algorithm paired with an optimizer"
site = "sections/1-1_introduction.tex, section A trained network uses some of its neurons and not others, and the task does not set which"
synonyms = { grokking = "learning rule, rule" }

[grokking]
definition = "a network fits its training data perfectly, sits at chance on held out data for thousands of epochs, then generalises abruptly"
site = "sections/1-1_introduction.tex, glossed inline at first use, not coined by the thesis"
synonyms = { grokking = "grokking, groks" }

[effective_unit_count]
definition = "n times the participation ratio of a layer's outgoing weight norms, for a layer of n units"
site = "chapter grokking, imported. The frame uses it as plain text and sends the reader there"
synonyms = { grokking = "effective unit count, n PR" }

[net]
definition = "a set of neurons each of which is supported by several others through recurrent connections, the representation of one sensory pattern in the Cooperative Network Architecture"
site = "chapter cna, imported. The frame describes it in plain words and sends the reader there"
synonyms = { cna = "net, assembled from net fragments" }

# Defined in the introduction and nowhere else. chap:acu opens on a relative
# clause that describes these systems again, which is a gloss in a chapter
# opening and not a second definition site, and the chapter was written that
# way deliberately.
[agent_for_computer_use]
definition = "a system that carries out tasks on a computer or a phone from an instruction in natural language, by controlling software through clicks, keystrokes and gestures"
site = "sections/1-1_introduction.tex, section A trained network uses some of its neurons and not others, and the task does not set which"
synonyms = { acu = "ACU, agent for computer use" }
