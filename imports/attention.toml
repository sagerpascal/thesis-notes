# The mathematical structure of self-attention, ICML 2025 submission.
#
# The project ships three variants. ICML2025 is the one with split section
# files and is the import source. Its own root file inputs everything with an
# `ICML2025/` prefix, so the paper root is the project directory, not the
# ICML2025 subdirectory.

slug    = "attention"
dir     = "imported_papers/self_attention_geometry_project_ICML"
chapter = "sections/4-2_attention.tex"
title   = "The Mathematical Structure of Self-Attention"
citation_key = "saponati_structures_2025"
status  = "wired"
layout  = "sections"
source  = "ICML2025/OLDmain-ICML2025.tex"

imported_on = "2026-05-21"
upstream    = ""

bib      = ["ICML2025/bib.bib"]
graphics = ["ICML2025/figures", "ICML2025/figures/figures-pdf"]

# Whole trees that are not part of this import.
[exclude]
"ICML2025-rebuttal/**" = "the response letter to the ICML reviewers, not part of the paper"
"arXiv/**"             = "the arXiv variant, superseded by the ICML2025 tree"

[drop]
"ICML2025/OLDmain-ICML2025.tex" = "the paper's own root file, replaced by the chapter wrapper"
"ICML2025/sections/abstract.tex"     = "the thesis has its own abstract"
"ICML2025/sections/introduction.tex" = "replaced by the chapter introduction"
"ICML2025/sections/discussion.tex"   = "replaced by the chapter summary and the thesis discussion"
"ICML2025/supplementary/related-work.tex"                    = "the paper's own root file has this commented out"
"ICML2025/supplementary/math-characterization-bilinear-form.tex" = "not reached from the paper's root file"
"ICML2025/sections/realted-work.tex" = "covered by the thesis background chapter"

[prune]
"ICML2025/icml2025.sty"    = "ICML template, the thesis uses kaobook"
"ICML2025/icml2025.bst"    = "ICML bibliography style, the thesis uses kaobiblio"
"ICML2025/algorithm.sty"   = "bundled copy of a standard package"
"ICML2025/algorithmic.sty" = "bundled copy of a standard package"
"ICML2025/fancyhdr.sty"    = "bundled copy of a standard package"

