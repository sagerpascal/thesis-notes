# drop table below names sections by their \section title.

slug    = "llmbench"
dir     = "imported_papers/Llama2_benchmark_sds"
chapter = "sections/3-2_further_contributions.tex"
title   = "Limitations of Foundation Models"
citation_key = "tuggener_private_2024"
