summary_reason = """Model evaluation only; the survey, benchmark design and write up are the co-authors' work."""
layout  = "monolithic"
source  = "llm_at_home.tex"
split   = "section"

imported_on = "2026-05-21"
upstream    = ""

bib      = ["references.bib"]
graphics = ["imgs"]

