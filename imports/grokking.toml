# Grokking beyond backpropagation, ICLR 2027 submission.
#
# Vendored from the paper directory of the project repository only. The
# upstream project is a full research codebase and none of it except
# docs/paper/ belongs in the thesis.

slug    = "grokking"
dir     = "imported_papers/grokking"
chapter = "sections/4-1_grokking.tex"
title   = "Grokking Beyond Backpropagation"
citation_key = "sager_grokking_2026"
status  = "pending"
layout  = "monolithic"
source  = "iclr2027_conference_v2.tex"
split   = "section"

imported_on = "2026-11-14"
upstream    = ""            # <repo>/docs/paper, contents copied into `dir`

bib      = ["iclr2027_conference.bib"]
graphics = ["figures"]

[drop]
"(front matter)"        = "title, authors and abstract, replaced by the chapter introduction and the publication header box"
"Introduction"          = "replaced by the chapter introduction"
"Background and related work" = "covered by the thesis related work chapter"
"Discussion and conclusions"  = "replaced by the chapter summary and the thesis discussion"

[prune]
"iclr2027_conference.sty" = "ICLR template, the thesis uses kaobook"
"iclr2027_conference.bst" = "ICLR bibliography style, the thesis uses kaobiblio"
"iclr2027_conference.tex" = "the ICLR template's own sample document, not the paper"
"natbib.sty"              = "bundled copy of a standard package"
"fancyhdr.sty"            = "bundled copy of a standard package"
"compile.sh"              = "the paper's own build script"
"*.fls"                   = "pdflatex build artefact"
"*.fdb_latexmk"           = "latexmk build artefact"
"*.aux"                   = "pdflatex build artefact"
"*.bbl"                   = "bibtex build artefact"
"*.blg"                   = "bibtex build artefact"
"*.log"                   = "pdflatex build artefact"
"*.out"                   = "hyperref build artefact"
"iclr2027_conference_v2.pdf" = "built output of the paper"
"iclr2027_conference_v2 copy.tex" = "a working copy of the manuscript"
"iclr2027_conference_v2 copy.pdf" = "built output of a working copy of the manuscript"
"archive_pre-revision_2026-09-20.tex" = "an earlier revision of the manuscript"
"diff_*.tex"              = "latexdiff drafts against earlier revisions"
"diff_*.pdf"              = "built output of the latexdiff drafts"
"*.md"                    = "the author's revision plans, rebuttals and review replies"
"reviews/**"              = "reviews collected during the revision rounds"
"arxiv/**"                = "the arXiv packaging of the paper, with its own build tree"
"output/**"               = "built output of the paper"
"tmp/**"                  = "the author's scratch directory, 49 MB of intermediate PDFs"
"figures/data/**"         = "the result JSONs the figure scripts read, 113 MB and not read by LaTeX"
"figures/review-baseline/**"    = "figures of an earlier revision, kept for comparison"
"figures/afternoon-baseline/**" = "figures of an earlier revision, kept for comparison"
"figures/*.svg"           = "vector sources of figures the paper includes as PDF"
"figures/*.html"          = "a browser preview of one figure"

# Parts the thesis carries in its appendix rather than in the chapter.
[appendix]
"Experimental details" = "appendix material of the paper"
"Circuit measurements and algorithm checks" = "appendix material of the paper"
"Controls on credit equalization" = "appendix material of the paper"
"Normalization groups and optimizer comparison" = "appendix material of the paper"
"Neuron deletion and adaptation" = "appendix material of the paper"
"Other tasks and architectures" = "appendix material of the paper"
"Theory of credit equalization" = "appendix material of the paper"
"Supplementary analysis of generalization" = "appendix material of the paper"
