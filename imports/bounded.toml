# Correcting state-probe evaluation of world models for norm drift, the
# Frontiers version of the work that was the Koopman-JEPA paper and then the
# TMLR rewrite "Bounded Is Not Better". The slug stays `bounded`, so the
# chapter file, its label and the thesis appendix keep their names.
#
# Vendored from the paper directory of the project repository. The upstream
# project is a research codebase: its analysis scripts, its result JSONs, its
# review archive and its build outputs are pruned, and only the manuscript
# and the figures it includes are kept.

slug    = "bounded"
dir     = "imported_papers/probe-norm"
chapter = "sections/5-1_bounded.tex"
title   = "Correcting State-Probe Evaluation of World Models for Norm Drift"
citation_key = "sager_bounded_2026"
status  = "pending"
layout  = "monolithic"
source  = "main.tex"
body    = ["content/body.tex", "content/supplement.tex"]
split   = "section"

imported_on = "2026-11-14"
upstream    = ""            # <repo>, manuscript files only

bib      = ["main.bib"]
graphics = ["figures"]

[drop]
"(front matter)" = "title, authors and abstract, replaced by the chapter introduction and the publication header box"
"Introduction"   = "replaced by the chapter introduction"
"Related Work"   = "covered by the thesis related work chapter"
"Discussion"     = "replaced by the chapter summary and the thesis discussion"
"Conclusion"     = "replaced by the chapter summary"
"Literature Survey" = "the survey of 39 published evaluations backs a claim the paper makes in its introduction, which this chapter replaces, so nothing in the kept text points at it. Its table also carried 44 of the thesis's overfull rows. Where the chapter introduction uses the survey's numbers it cites the paper."

# Parts the thesis carries in its appendix rather than in the chapter. They
# are the sections of the Frontiers supplement, which is a second document
# upstream and the paper's appendix here.
[appendix]
"Synthetic Controls"     = "appendix material of the paper"
"The Trained Modules"    = "appendix material of the paper"
"The Published Models"   = "appendix material of the paper"
"Code for the Protocol"  = "appendix material of the paper"

[prune]
".gitignore"            = "the project repository's ignore file"
"FRONTIERS_CHECKLIST.md" = "the publisher's submission checklist"
"Frontiers-Harvard.bst" = "Frontiers bibliography style, the thesis uses kaobiblio"
"FrontiersinHarvard.cls" = "Frontiers template, the thesis uses kaobook"
"frontiers_suppmat.cls" = "Frontiers supplement template, the thesis uses kaobook"
"preprint.sty"          = "the preprint variant's template"
"preprint.tex"          = "the preprint variant of the manuscript, not the submitted paper"
"build.py"              = "the paper's own build script"
"check.py"              = "the paper's own style script"
"ledger.json"           = "the project's bookkeeping, not part of the paper"
"review_notes.txt"      = "the author's review notes"
"logo1.eps"             = "the publisher's logo"
"logo1.pdf"             = "the publisher's logo"
"logo1-eps-converted-to.pdf" = "the publisher's logo"
"data/**"               = "the result JSONs and CSVs the figure scripts read, 40 MB and not read by LaTeX"
"scripts/**"            = "the analysis and figure scripts of the research codebase"
"review/**"             = "annotated drafts and mock reviews from the revision rounds"
"submission/**"         = "the publisher's submission forms"
"templates/**"          = "the author's skeletons for the manuscript files"
"figures/*.tif"         = "the publisher's raster figure copies, pdflatex uses the PDFs"
"*.aux"                 = "pdflatex build artefact"
"*.bbl"                 = "bibtex build artefact"
"*.blg"                 = "bibtex build artefact"
"*.log"                 = "pdflatex build artefact"
"*.out"                 = "hyperref build artefact"
"*.fls"                 = "pdflatex build artefact"
"*.fdb_latexmk"         = "latexmk build artefact"
"main.pdf"              = "built output of the paper"
"preprint.pdf"          = "built output of the preprint variant"
"supplementary.pdf"     = "built output of the supplement"
